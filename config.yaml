device: "cuda"

training:
  epochs: 3
  learning_rate: 2e-5
  batch_size: 8
  gradient_accumulation_steps: 4
  max_grad_norm: 0.5

  max_input_length: 2048
  max_new_tokens: 128
  temperature: 0.7

  dpo_beta: 0.1
  dpo_method: "original"

  lambda_consistency: 0.5
  lambda_retrieval: 0.1
  consistency_method: "spearman"
  num_candidates: 3

  normalize_rewards: true
  reward_clipping: true
  reward_clip_range: 10.0

  use_direct_document_training: true
  direct_training_ratio: 0.3
  top_k_variance: true

  train_data_path: "qa_data/combined_100000.jsonl"
  questions_path: "data/combined/questions.jsonl"

  max_questions_from_corpus: 10000
  max_samples: 10000
  context_length_limit: 1000
  document_truncation_limit: 500

  optimizer: "adamw"
  weight_decay: 0.01
  scheduler: "cosine"

  log_interval: 10
  eval_interval: 100
  save_interval: 1
  save_path: "./checkpoints/rag_cream_enhanced_dpo"

  preference_buffer_size: 2048

  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.1

  use_4bit: false
  use_8bit: false
  use_bf16: true
  use_fp16: false
  gradient_checkpointing: false
  flash_attention: false
  compile_model: false

  save_total_limit: 10
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

  report_to: []
  run_name: "dpo_llama7b_cream_consistency"

model:
  name: "meta-llama/Llama-4-Scout-17B-16E"
  max_length: 2048
  context_length: 1600

rag:
  top_k: 8
  max_doc_length: 1000
  max_context_length: 1600
  use_rag_enhancement: true

retriever:
  document_path: "data/corpus.jsonl"
  index_path: "index_embeddings"
  top_k: 8

datasets:
  - name: "ragtruth"
    path: "/workspace/cream_rag_data/backups/20250902_021122/CREAMRAG/data/ragtruth"
    max_samples: null

  - name: "ms_marco"
    path: "/workspace/cream_rag_data/backups/20250902_021122/CREAMRAG/data/ms_marco"
    max_samples: null

evaluation:
  metrics: ["exact_match", "f1_score", "consistency"]
  eval_batch_size: 4
  max_eval_samples: 1000

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  project: "dpo-llama7b-cream"
  entity: null
  tags: ["dpo", "llama7b", "cream", "consistency", "rag"]
  notes: "Full-scale DPO training with Llama 7B, CREAM consistency, and RAG enhancement"
